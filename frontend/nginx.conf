# Study Trail Builder - frontend nginx config (Req 7.6)
# Serves the Angular static build and reverse-proxies the API to the backend,
# so browser requests are same-origin and no CORS preflight is needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to the backend service. No trailing slash/path on
    # proxy_pass, so the request URI (e.g. /api/trail) is forwarded unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
